name: Catalog correction
description: A price, limit, compliance statement or other fact about a tool is wrong or out of date.
labels: ["catalog"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Name or slug, e.g. Supabase or supabase
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What Cuely says now
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What's correct
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The vendor's own page that shows the correct fact
    validations:
      required: true
  - type: checkboxes
    id: vendor
    attributes:
      label: Disclosure
      options:
        - label: I work for or am paid by this vendor
