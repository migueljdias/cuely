name: Pricing freshness

# Reads every tool's pricing page once a week and proposes the changes as a pull
# request. It only updates the snapshots under data/pricing; the catalog itself is
# updated by a person who has read the page.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pricing-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Read pricing pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Read pages and compare with the last read
        id: read
        run: npm run -s check:pricing -- --report "$RUNNER_TEMP/pricing-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Propose the changes
        if: steps.read.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: freshness/pricing
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          title="Pricing pages changed ($(date -u +%F))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/pricing
          git commit -m "$title"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pricing-report.md"
          elif ! gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/pricing-report.md"; then
            # The repository doesn't let Actions open pull requests: file the report as an issue instead.
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/pricing-report.md"
          fi
