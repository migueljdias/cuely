name: Bug or wrong pick
description: A tool returned an error, or a pick doesn't make sense for the product described.
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: MCP tool
      options: [recommend_stack, start_project, check_project, get_recipe, compare_tools, list_categories, website]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The arguments sent. Leave out anything private; Cuely only needs a plain description and tool names.
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
    validations:
      required: true
